name: Build Windows EXE

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "taobao-image-helper/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify Microsoft Edge support
        run: python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); p.chromium.launch(channel='msedge', headless=True).close(); p.stop()"
      - name: Build application
        shell: cmd
        run: call taobao-image-helper\build_exe.bat
      - uses: actions/upload-artifact@v7
        with:
          name: taobao-image-helper-windows
          path: taobao-image-helper/dist/淘宝图片助手.exe
          if-no-files-found: error
          retention-days: 30
