name: Build Windows EXE

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "taobao-image-helper/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build application
        shell: cmd
        run: call taobao-image-helper\build_exe.bat
      - name: Package application folder
        shell: pwsh
        run: Compress-Archive -Path 'taobao-image-helper\dist\淘宝图片助手' -DestinationPath 'taobao-image-helper\dist\淘宝图片助手-Windows.zip' -Force
      - uses: actions/upload-artifact@v7
        with:
          name: taobao-image-helper-windows
          path: taobao-image-helper/dist/淘宝图片助手-Windows.zip
          if-no-files-found: error
          retention-days: 30
